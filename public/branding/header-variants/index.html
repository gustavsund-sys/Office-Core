<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Office Core – headerförslag</title><style>body{margin:0;background:#09131c;color:#edf3f6;font:16px system-ui}main{max-width:1500px;margin:auto;padding:36px 24px}h1{font-size:36px;margin:0 0 12px}p{color:#a9bdcc}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:32px}figure{margin:0;background:#132330;border:1px solid #294252;border-radius:12px;overflow:hidden}img{display:block;width:100%;aspect-ratio:3/1;object-fit:contain}figcaption{padding:16px;font-weight:600}a{color:inherit;text-decoration:none}a:hover img{filter:brightness(1.08)}@media(max-width:850px){section{grid-template-columns:1fr}}</style><main><h1>Office Core / Headerförslag</h1><p>Tio närmare porträtt med olika poser och personligheter. Klicka på en bild för full storlek.</p><section id="gallery"></section></main><script>fetch('prompts.json').then(r=>r.json()).then(({variants})=>{document.querySelector('#gallery').innerHTML=variants.map(([id,title])=>`<figure><a href="${id}.png" target="_blank" rel="noopener"><img src="${id}.webp" alt="${title}" loading="lazy"><figcaption>${id} · ${title}</figcaption></a></figure>`).join('')})</script></html>
