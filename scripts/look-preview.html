<!doctype html><html lang="sv"><meta charset="utf-8"><title>Office Core · materialstudie</title><style>body{margin:0;background:#10232b;color:#ffdfae;font:14px system-ui}canvas{width:100vw;height:100vh;display:block}nav{position:fixed;top:20px;left:20px;display:flex;flex-wrap:wrap;max-width:calc(100vw - 40px);gap:12px;background:#10232be8;padding:14px;border-radius:12px}button{background:#ffdfae;border:0;border-radius:5px;padding:8px;cursor:pointer}span{align-self:center}</style><canvas id="view"></canvas><nav><span>OFFICE CORE · MATERIALSTUDIE</span><button id="close">Närbild</button><button id="map">Spelvy</button><button id="glass">Glaskontor</button><button id="meeting">Mötesrum</button><button id="service">Tak & teknik</button><button id="pass">Passera glaset</button><button id="shadows">Skuggor av/på</button></nav><script type="module">
import {Engine,WebGPUEngine,Scene,Color4,Vector3,FreeCamera,HemisphericLight,DirectionalLight,ShadowGenerator,GlowLayer} from '@babylonjs/core';
import {World} from '/src/map/builder.ts';import{Player}from'/src/player/player.ts';import{officeLighting}from'/src/visuals/artLighting.ts';
const canvas=document.querySelector('canvas');let engine;
if(new URLSearchParams(location.search).get('renderer')==='webgpu'){engine=new WebGPUEngine(canvas,{antialias:true,powerPreference:'high-performance'});await engine.initAsync();}else engine=new Engine(canvas,true,{powerPreference:'high-performance'});
const scene=new Scene(engine);scene.clearColor=Color4.FromHexString('#14232cff');const camera=new FreeCamera('review',new Vector3(-13,5,-13),scene);camera.minZ=.1;camera.maxZ=150;camera.setTarget(new Vector3(-8.75,1,-5));const sky=new HemisphericLight('sky',Vector3.Up(),scene),sun=new DirectionalLight('sun',new Vector3(-.65,-1,.45),scene);sun.position.set(12,30,-20);const shadows=new ShadowGenerator(1024,sun);shadows.usePercentageCloserFiltering=true;officeLighting(scene,sky,sun,shadows);const glow=new GlowLayer('glow',scene,{mainTextureFixedSize:512});glow.intensity=.2;const world=new World(scene,shadows);world.build();
for(const [x,color]of[[-9.8,'#fa675f'],[-7.8,'#55b6ff']]){const p=new Player(world);p.root.position.set(x,0,-6.3);p.root.rotation.y=Math.PI+.2;p.torso.material=world.finish(color,'fabric');p.setWeaponModel('machineGun');p.animate(false,0);}
const close=()=>{camera.mode=0;camera.position.set(-13,5,-13);camera.setTarget(new Vector3(-8.75,1,-5));};document.querySelector('#close').onclick=close;document.querySelector('#map').onclick=()=>{camera.mode=1;camera.orthoTop=10;camera.orthoBottom=-10;camera.orthoLeft=-10*canvas.clientWidth/canvas.clientHeight;camera.orthoRight=-camera.orthoLeft;camera.position.set(-8.75,23,-18);camera.setTarget(new Vector3(-8.75,0,-5));};document.querySelector('#glass').onclick=()=>{camera.mode=1;camera.orthoTop=12;camera.orthoBottom=-12;camera.orthoRight=12*canvas.clientWidth/canvas.clientHeight;camera.orthoLeft=-camera.orthoRight;camera.position.set(-23.8,23,-35.5);camera.setTarget(new Vector3(-23.8,0,-22.5));};document.querySelector('#shadows').onclick=()=>scene.shadowsEnabled=!scene.shadowsEnabled;
let passing=false;
document.querySelector('#meeting').onclick=()=>{passing=false;camera.mode=1;camera.orthoTop=11;camera.orthoBottom=-11;camera.orthoRight=11*canvas.clientWidth/canvas.clientHeight;camera.orthoLeft=-camera.orthoRight;camera.position.set(0,23,-42);camera.setTarget(new Vector3(0,0,-29));};
document.querySelector('#service').onclick=()=>{passing=false;camera.mode=1;camera.orthoTop=37;camera.orthoBottom=-37;camera.orthoRight=37*canvas.clientWidth/canvas.clientHeight;camera.orthoLeft=-camera.orthoRight;camera.position.set(0,60,-42);camera.setTarget(new Vector3(0,0,-7));};
document.querySelector('#pass').onclick=()=>{document.querySelector('#glass').click();passing=!passing;};
await world.whenAssetsReady();await scene.whenReadyAsync();if(new URLSearchParams(location.search).has('glass'))document.querySelector('#glass').click();if(new URLSearchParams(location.search).has('vent')){camera.mode=0;camera.position.set(9,12,10);camera.setTarget(new Vector3(2,2.6,23));}engine.runRenderLoop(()=>{if(passing){const dx=Math.sin(performance.now()*.00065)*6;camera.position.set(-23.8+dx,23,-35.5);camera.setTarget(new Vector3(-23.8+dx,0,-22.5));}scene.render();});window.addEventListener('resize',()=>engine.resize());
</script></html>
