<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>Office Core · Core & Pulse Trap</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101c25;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      header {
        position: absolute;
        left: 4%;
        top: 5%;
        font: 700 26px Arial;
        color: #edf6f7;
        letter-spacing: 3px;
      }
      small {
        display: block;
        font: 12px Arial;
        color: #99b6c4;
        letter-spacing: 2px;
        margin-top: 10px;
      }
      footer {
        position: absolute;
        bottom: 5%;
        left: 0;
        width: 100%;
        text-align: center;
        font: 700 14px Arial;
        letter-spacing: 2px;
        color: #ff9bd5;
      }
    </style>
  </head>
  <body>
    <header>
      OFFICE CORE<small>CORE REACTORS · PULSE TRAP · SPELETS 3D-MODELLER</small>
    </header>
    <canvas></canvas>
    <footer>PULSE TRAP · [3] SELECT · LMB PLACE</footer>
    <script type="module">
      import {
        Engine,
        Scene,
        Color4,
        Vector3,
        ArcRotateCamera,
        HemisphericLight,
        DirectionalLight,
        ShadowGenerator,
        MeshBuilder,
        GlowLayer,
      } from "@babylonjs/core";
      import { World } from "/src/map/builder";
      import { coreModel } from "/src/core/coreModel";
      import { pulseTrapModel } from "/src/game/pulseTrap";
      const engine = new Engine(document.querySelector("canvas"), true, {
        preserveDrawingBuffer: true,
      });
      const scene = new Scene(engine);
      scene.clearColor = new Color4(0.04, 0.065, 0.09, 1);
      const camera = new ArcRotateCamera(
        "camera",
        -Math.PI / 2 + 0.12,
        1.28,
        13,
        new Vector3(0, 1.6, 0),
        scene,
      );
      camera.fov = 0.65;
      const ambient = new HemisphericLight("fill", new Vector3(0, 1, 0), scene);
      ambient.intensity = 0.7;
      const key = new DirectionalLight(
        "key",
        new Vector3(-0.4, -1, 0.5),
        scene,
      );
      key.position.set(4, 8, -5);
      key.intensity = 1.5;
      const shadows = new ShadowGenerator(1024, key);
      shadows.useBlurExponentialShadowMap = true;
      const world = new World(scene, shadows);
      const floor = MeshBuilder.CreateGround(
        "floor",
        { width: 100, height: 100 },
        scene,
      );
      floor.material = world.mat("#172b3b");
      floor.receiveShadows = true;
      coreModel(world, "RED", -2.1, 0);
      coreModel(world, "BLUE", 2.1, 0);
      const mine = pulseTrapModel(world);
      mine.position.set(0, 0.07, -2);
      mine.scaling.setAll(1.65);
      mine.rotation.y = -0.2;
      const glow = new GlowLayer("plasma", scene, {
        mainTextureFixedSize: 512,
      });
      glow.intensity = 0.25;
      engine.runRenderLoop(() => scene.render());
      window.addEventListener("resize", () => engine.resize());
    </script>
  </body>
</html>
