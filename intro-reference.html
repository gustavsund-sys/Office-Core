<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101c25}canvas{width:100%;height:100%;display:block}header{position:absolute;left:4%;top:4%;color:#e4ede9;font:700 28px Arial;letter-spacing:4px}small{display:block;font:12px Arial;letter-spacing:2px;color:#97adb9;margin-top:10px}nav{position:absolute;bottom:20px;left:4%}button{padding:10px;margin-right:8px}body.clean nav{display:none}</style></head><body><header>OFFICE CORE<small id="label">ACTUAL GAME MODELS · CHARACTER & EQUIPMENT REFERENCE</small></header><canvas id="view"></canvas><nav><button id="characters">Characters</button><button id="equipment">Equipment</button><button id="clean">Hide controls</button></nav><script type="module">
import {Engine,Scene,Color4,Color3,Vector3,ArcRotateCamera,HemisphericLight,DirectionalLight,ShadowGenerator,MeshBuilder} from '@babylonjs/core';
import {World} from './src/map/builder';import {Player} from './src/player/player';import {beaconModel} from './src/game/beacon';import {heldWeapon} from './src/weapons/models';
const engine=new Engine(document.querySelector('canvas'),true,{preserveDrawingBuffer:true});const scene=new Scene(engine);scene.clearColor=new Color4(.045,.073,.095,1);const camera=new ArcRotateCamera('camera',-.95,1.15,8,new Vector3(0,.95,0),scene);camera.fov=.52;const ambient=new HemisphericLight('ambient',new Vector3(0,1,0),scene);ambient.intensity=.85;const sun=new DirectionalLight('key',new Vector3(-.5,-1,.6),scene);sun.position.set(3,7,-4);sun.intensity=2;const shadows=new ShadowGenerator(1024,sun);shadows.useBlurExponentialShadowMap=true;const world=new World(scene,shadows);const floor=MeshBuilder.CreateGround('floor',{width:200,height:200},scene);floor.material=world.mat('#182936');floor.receiveShadows=true;
let roots=[];function clear(){roots.forEach(r=>r.dispose());roots=[];}
function characters(){clear();camera.alpha=-Math.PI/2+.2;camera.beta=1.22;camera.radius=8;camera.target.set(0,.95,0);for(const [x,color,weapon] of [[-1,'#ff5757','machineGun'],[1,'#58c6ff','pulseGun']]){const p=new Player(world);p.root.position.set(x,0,0);p.root.rotation.y=Math.PI-.3;p.torso.material=world.mat(color);p.setWeaponModel(weapon);roots.push(p.root);}document.querySelector('#label').textContent='RED & BLUE · ACTUAL GAME CHARACTER MODELS';}
function equipment(){clear();camera.alpha=-1.1;camera.beta=1.05;camera.radius=9;camera.target.set(0,.75,0);const b=beaconModel(world,'BLUE');b.root.position.set(-1.5,0,0);b.head.rotation.y=Math.PI/2;roots.push(b.root);const bomb=heldWeapon(world,'coreBuster');bomb.position.set(1,.7,0);bomb.scaling.setAll(1.5);roots.push(bomb);const gun=heldWeapon(world,'pulseGun');gun.position.set(2,.3,-1);gun.rotation.y=-Math.PI/2;gun.scaling.setAll(1.5);roots.push(gun);document.querySelector('#label').textContent='DEFENSIVE BEACON · CORE BUSTER · PULSE GUN';}
document.querySelector('#characters').onclick=characters;document.querySelector('#equipment').onclick=equipment;document.querySelector('#clean').onclick=()=>document.body.classList.add('clean');characters();engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());
</script></body></html>
